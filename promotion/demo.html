<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reqix · 商品列表演示</title>
  <link rel="icon" href="/reqix-logo.png">
  <style>
    :root { color-scheme: light; --bg:#f6f7f9; --panel:#fff; --text:#202733; --muted:#79818d; --line:#e7e9ee; --blue:#315fcd; --soft:#f0f4fd; --green:#387960; }
    :root[data-theme="dark"] { color-scheme:dark; --bg:#171b22; --panel:#20262f; --text:#e7ebf2; --muted:#a4adbd; --line:#333c48; --blue:#98b5ff; --soft:#29364f; --green:#9aceb2; }
    * { box-sizing:border-box; } body { margin:0; color:var(--text); background:var(--bg); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; font-size:14px; }
    button { font:inherit; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--line); border-radius:7px; padding:9px 13px; color:var(--text); background:var(--panel); }
    button:hover { border-color:var(--blue); } button:focus-visible { outline:3px solid var(--blue); outline-offset:3px; } button:disabled { cursor:wait; opacity:.6; }
    header { height:72px; background:var(--panel); border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; padding:0 5%; gap:20px; }
    .brand { display:flex; align-items:center; gap:10px; font-size:21px; font-weight:680; letter-spacing:-.7px; }.brand img { width:30px; height:30px; }.brand small { margin-left:13px; border-left:1px solid var(--line); padding-left:20px; font-size:12px; font-weight:400; letter-spacing:0; color:var(--muted); }
    .controls { display:flex; gap:10px; }.controls button { border:0; font-size:12px; padding:8px; color:var(--muted); }
    main { max-width:1260px; margin:auto; padding:45px 36px 30px; }.eyebrow { color:var(--muted); font-size:11px; letter-spacing:2px; margin-bottom:12px; }
    .heading { display:flex; align-items:center; justify-content:space-between; gap:25px; margin-bottom:28px; } h1 { margin:0 0 11px; font-size:30px; font-weight:660; letter-spacing:-1px; } .heading p { color:var(--muted); margin:0; line-height:1.7; } .primary { background:#315fcd; border-color:#315fcd; color:#fff; white-space:nowrap; font-weight:550; }
    .layout { display:grid; grid-template-columns:minmax(0,1.75fr) minmax(270px,1fr); gap:22px; align-items:start; }.panel { border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--panel); }
    .panel-heading { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:20px 22px; border-bottom:1px solid var(--line); }.panel-heading h2 { margin:0; font-size:15px; font-weight:620; } #count { display:inline-flex; align-items:center; justify-content:center; min-width:24px; height:22px; border-radius:4px; background:var(--soft); color:var(--blue); font-size:12px; margin-left:8px; }
    .muted { color:var(--muted); font-size:12px; }.status { display:flex; align-items:center; gap:7px; color:var(--green); font-size:12px; }.status:before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
    .table-wrap { min-height:274px; overflow-x:auto; } table { width:100%; border-collapse:collapse; text-align:left; } th { padding:12px 22px; font-size:11px; color:var(--muted); font-weight:500; border-bottom:1px solid var(--line); } td { padding:21px 22px; border-bottom:1px solid var(--line); font-size:13px; } tr:last-child td { border-bottom:0; } td:first-child { min-width:210px; } td:last-child,th:last-child { text-align:right; }.product-name { font-weight:550; } .product-id { margin-top:5px; color:var(--muted); font-size:10px; letter-spacing:.5px; }
    .empty { min-height:274px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px; text-align:center; }.empty[hidden],.table-wrap[hidden] { display:none; }.empty-mark { width:46px; height:42px; border:1.5px solid var(--line); border-radius:6px; position:relative; margin-bottom:18px; background:var(--bg); }.empty-mark:before,.empty-mark:after { content:""; position:absolute; height:2px; border-radius:2px; background:var(--muted); left:12px; right:12px; top:16px; opacity:.5; }.empty-mark:after { top:23px; right:18px; }.empty h3 { margin:0 0 9px; font-size:16px; font-weight:600; }.empty p { margin:0; color:var(--muted); font-size:12px; }
    .panel-footer { border-top:1px solid var(--line); padding:14px 22px; color:var(--muted); font-size:11px; }.endpoint { padding:15px 19px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; font-family:ui-monospace,monospace; font-size:12px; }.method { font-size:10px; color:var(--green); font-weight:700; }.http { margin-left:auto; color:var(--green); font-size:10px; } pre { margin:0; padding:19px; max-height:320px; overflow:auto; color:var(--text); font:11px/1.8 ui-monospace,SFMono-Regular,monospace; white-space:pre-wrap; word-break:break-word; }
    footer { margin-top:24px; display:flex; justify-content:space-between; gap:15px; color:var(--muted); font-size:11px; line-height:1.7; } .connection { display:flex; align-items:center; gap:6px; }.connection:before { content:""; width:5px; height:5px; border-radius:50%; background:var(--green); }
    /* DevTools 停靠底部时压缩间距，保留三条商品和空状态的完整画面。 */
    @media(max-height:650px) and (min-width:851px) { header { height:52px; } main { padding:18px 30px; } .eyebrow { display:none; } .heading { margin-bottom:16px; } h1 { font-size:24px; margin-bottom:5px; } .heading p { font-size:12px; } .panel-heading { padding:13px 18px; } th { padding:9px 18px; } td { padding:11px 18px; } .table-wrap,.empty { min-height:185px; } .empty { padding:18px; } .panel-footer { padding:10px 18px; } pre { max-height:210px; padding:14px 18px; } .endpoint { padding:10px 18px; } footer { margin-top:12px; } }
    @media(max-width:850px) { main { padding:30px 20px; }.layout { grid-template-columns:1fr; }.brand small { display:none; } .heading { align-items:flex-start; } h1 { font-size:26px; } }
    @media(max-width:480px) { .heading { flex-direction:column; } header { padding:0 20px; } footer { flex-direction:column; } th,td { padding:15px; } }
  </style>
</head>
<body>
  <header><div class="brand"><img src="/reqix-logo.png" alt="">Reqix<small data-i18n="badge"></small></div><div class="controls"><button id="theme"><span aria-hidden="true">◐</span><span data-i18n="theme"></span></button><button id="locale"><span aria-hidden="true">↔</span><span id="locale-label">EN</span></button></div></header>
  <main>
    <div class="eyebrow" data-i18n="workspace"></div>
    <div class="heading"><div><h1 data-i18n="title"></h1><p data-i18n="intro"></p></div><button class="primary" id="refresh"><span aria-hidden="true">↻</span><span data-i18n="refresh"></span></button></div>
    <div class="layout">
      <section class="panel"><div class="panel-heading"><h2><span data-i18n="list"></span><span id="count">—</span></h2><span class="status" id="state" role="status"></span></div>
        <div class="table-wrap" id="table"><table><thead><tr><th data-i18n="product"></th><th data-i18n="category"></th><th data-i18n="stock"></th><th data-i18n="price"></th></tr></thead><tbody id="products"></tbody></table></div>
        <div class="empty" id="empty" hidden><div class="empty-mark" aria-hidden="true"></div><h3 id="empty-title"></h3><p id="empty-description"></p></div>
        <div class="panel-footer" data-i18n="listNote"></div>
      </section>
      <section class="panel"><div class="panel-heading"><h2 data-i18n="response"></h2><span class="muted">JSON</span></div><div class="endpoint"><span class="method">GET</span><span>/api/products</span><span class="http" id="http">—</span></div><pre id="response" aria-live="polite"></pre></section>
    </div>
    <footer><span data-i18n="note"></span><span class="connection" data-i18n="local"></span></footer>
  </main>
  <script>
    // 页面只通过真实 Fetch 读取接口；没有用于切换为空状态的演示开关。
    const messages = {
      zh: { workspace:'商品工作台', badge:'接口调试演示', theme:'切换主题', title:'商品管理', intro:'查看当前在售商品与库存情况。', refresh:'重新加载', list:'商品列表', product:'商品名称', category:'分类', stock:'库存', price:'单价', response:'本次接口响应', listNote:'列表内容根据接口返回的数据更新。', note:'所有商品均为虚构的演示数据。', local:'本地演示环境', loading:'加载中', loaded:'加载完成', empty:'还没有商品', emptyNote:'有新商品上架时，会出现在这里。', error:'加载失败', errorNote:'请确认本地接口可用后重试。', invalid:'接口返回的数据格式不正确。' },
      en: { workspace:'PRODUCT WORKSPACE', badge:'API debugging demo', theme:'Theme', title:'Products', intro:'Manage available products and keep track of inventory.', refresh:'Reload products', list:'Product list', product:'Product', category:'Category', stock:'Stock', price:'Price', response:'API response', listNote:'This list is rendered from the API response.', note:'All products are fictional demo data.', local:'Local demo environment', loading:'Loading', loaded:'Loaded', empty:'No products yet', emptyNote:'New products will appear here when available.', error:'Unable to load', errorNote:'Check the local API and try again.', invalid:'The API returned an invalid response.' }
    };
    let locale = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'zh';
    let payload = null;
    let failure = false;
    let busy = false;
    const productNames = { 'P-1001':'帆布双肩包', 'P-1002':'日常笔记本', 'P-1003':'陶瓷马克杯' };
    const categoryNames = { Bags:'包袋', Stationery:'文具', Home:'生活' };
    const $ = (id) => document.getElementById(id);
    function render() {
      const t = messages[locale];
      document.documentElement.lang = locale === 'zh' ? 'zh-CN' : 'en';
      document.title = `Reqix · ${t.badge}`;
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t[el.dataset.i18n]; });
      $('locale-label').textContent = locale === 'zh' ? 'EN' : '中文';
      $('state').textContent = busy ? t.loading : failure ? t.error : t.loaded;
      $('refresh').disabled = busy;
      $('count').textContent = payload ? payload.products.length : '—';
      $('products').replaceChildren();
      for (const item of payload?.products || []) {
        const tr = document.createElement('tr');
        const name = document.createElement('td');
        const title = document.createElement('div'); title.className = 'product-name'; title.textContent = locale === 'zh' ? productNames[item.id] || item.name : item.name;
        const id = document.createElement('div'); id.className = 'product-id'; id.textContent = item.id;
        name.append(title, id); tr.append(name);
        for (const value of [locale === 'zh' ? categoryNames[item.category] || item.category : item.category, String(item.stock), `¥${item.price}`]) { const td = document.createElement('td'); td.textContent = value; tr.append(td); }
        $('products').append(tr);
      }
      const isEmpty = Boolean(payload && !payload.products.length) || failure;
      $('empty').hidden = !isEmpty; $('table').hidden = isEmpty;
      $('empty-title').textContent = failure ? t.error : t.empty;
      $('empty-description').textContent = failure ? t.errorNote : t.emptyNote;
    }
    async function loadProducts() {
      busy = true; failure = false; render();
      try {
        const response = await fetch('/api/products', { cache:'no-store' });
        $('http').textContent = `${response.status} ${response.statusText}`.trim();
        const body = await response.json();
        $('response').textContent = JSON.stringify(body, null, 2);
        if (!response.ok || !Array.isArray(body.products)) throw new Error(messages[locale].invalid);
        payload = body;
      } catch { payload = null; failure = true; }
      finally { busy = false; render(); }
    }
    $('refresh').addEventListener('click', loadProducts);
    $('locale').addEventListener('click', () => { locale = locale === 'zh' ? 'en' : 'zh'; render(); });
    $('theme').addEventListener('click', () => { document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; });
    loadProducts();
  </script>
</body>
</html>
